<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Breezecast – Montreal</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'IBM Plex Mono', 'Courier New', monospace;
      background: linear-gradient(160deg, #0f172a 0%, #0c2a4a 60%, #1e3a5f 100%);
      min-height: 100vh;
      color: white;
    }

    .gif-header {
      width: 100%;
      height: 72px;
      background: url('anim_lp.gif') center 30% / cover no-repeat;
      position: relative;
    }
    .gif-header::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(15,23,42,0.25) 0%, rgba(15,23,42,0.7) 100%);
    }

    .app {
      max-width: 1800px;
      margin: 0 auto;
      padding: 28px 16px 56px;
    }

    /* ── Header ─────────────────────────────────────── */
    .header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: start;
      margin-bottom: 40px;
    }
    .header-center {
      text-align: center;
    }
    .back-btn {
      display: inline-block;
      color: rgba(255,255,255,0.6);
      font-size: 12px;
      font-weight: 500;
      text-decoration: none;
      padding: 6px 14px;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 20px;
      transition: background 0.2s, color 0.2s;
    }
    .back-btn:hover {
      background: rgba(255,255,255,0.1);
      color: white;
    }
    .location-name {
      font-size: 11px;
      font-weight: 500;
      color: rgba(255,255,255,0.5);
      letter-spacing: 0.25em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .current-temp {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(64px, 14vw, 96px);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -3px;
      color: white;
    }
    .current-feels {
      margin-top: 6px;
      font-size: 13px;
      color: rgba(255,255,255,0.45);
    }
    .header-right { text-align: center; }
    .updated {
      font-size: 11px;
      color: rgba(255,255,255,0.28);
      margin-top: 8px;
    }

    /* ── Section labels ──────────────────────────────── */
    .section-label {
      font-size: 10px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: rgba(255,255,255,0.38);
      margin-bottom: 12px;
      padding-left: 2px;
    }

    /* ── 7-Day cards ─────────────────────────────────── */
    .days-section { margin-bottom: 36px; }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
    }

    @media (max-width: 720px) {
      .days-grid {
        display: flex;
        overflow-x: auto;
        gap: 10px;
        padding-bottom: 8px;
        scroll-snap-type: x mandatory;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      .days-grid::-webkit-scrollbar { display: none; }
    }

    .day-card {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 18px;
      padding: 16px 10px 14px;
      text-align: center;
      backdrop-filter: blur(8px);
      transition: background 0.2s, transform 0.18s;
      min-width: 120px;
      scroll-snap-align: start;
    }
    .day-card:hover {
      background: rgba(255,255,255,0.13);
      transform: translateY(-3px);
    }
    .day-card.today {
      background: rgba(96,165,250,0.17);
      border-color: rgba(96,165,250,0.38);
    }
    .day-name {
      font-size: 11px;
      font-weight: 500;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      letter-spacing: 0.15em;
    }
    .day-card.today .day-name { color: #60a5fa; }
    .day-date {
      font-size: 11px;
      color: rgba(255,255,255,0.28);
      margin-top: 2px;
      margin-bottom: 8px;
    }
    .day-icon {
      font-size: 28px;
      line-height: 1;
      margin: 4px 0 8px;
    }
    .day-temps {
      display: flex;
      justify-content: center;
      gap: 10px;
      font-size: 17px;
      font-weight: 500;
      margin-bottom: 10px;
    }
    .t-high { color: #fb923c; }
    .t-low  { color: #60a5fa; }
    .day-divider {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.09);
      margin-bottom: 8px;
    }
    .day-meta {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .meta-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      padding: 0 2px;
    }
    .ml { color: rgba(255,255,255,0.33); }
    .mv { color: rgba(255,255,255,0.72); font-weight: 500; }

    /* ── Charts ──────────────────────────────────────── */
    .chart-section { margin-bottom: 28px; }

    .chart-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 20px;
      overflow: hidden;
    }
    .chart-scroll {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.2) transparent;
    }
    .chart-scroll::-webkit-scrollbar {
      height: 4px;
    }
    .chart-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .chart-scroll::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.2);
      border-radius: 2px;
    }
    .chart-div {
      width: 100%;
      height: 630px;
    }
    @media (max-width: 600px) {
      .chart-div {
        height: 480px;
        min-width: 1050px;
        width: 1050px;
      }
    }

    /* ── Footer ──────────────────────────────────────── */
    .footer {
      text-align: center;
      color: rgba(255,255,255,0.18);
      font-size: 11px;
      margin-top: 36px;
      letter-spacing: 0.1em;
    }
  </style>
</head>

// ── Render day cards ──────────────────────────────────────
function renderCards() {
  const container = document.getElementById('dayCards');
  DAILY.forEach((d, i) => {
    const isToday = i === 0;
    const card = document.createElement('div');
    card.className = 'day-card' + (isToday ? ' today' : '');

    const feelsRow = d.feels_low !== null
      ? `<div class="meta-row"><span class="ml">Feels</span><span class="mv">${d.feels_low}°</span></div>`
      : '';
    const snowRow = d.snow > 0
      ? `<div class="meta-row"><span class="ml">Snow</span><span class="mv">${d.snow} cm</span></div>`
      : '';

    card.innerHTML = `
      <div class="day-name">${isToday ? 'Today' : d.day}</div>
      <div class="day-date">${d.date}</div>
      <div class="day-icon">${d.icon}</div>
      <div class="day-temps">
        <span class="t-high">${d.high !== null ? d.high + '°' : '--'}</span>
        <span class="t-low"> ${d.low  !== null ? d.low  + '°' : '--'}</span>
      </div>
      <hr class="day-divider">
      <div class="day-meta">
        ${feelsRow}
        <div class="meta-row"><span class="ml">Rain</span><span class="mv">${d.precip} mm</span></div>
        ${snowRow}
      </div>
    `;
    container.appendChild(card);
  });
}

// ── Dark theme for Plotly layouts ─────────────────────────
function applyAnalogTheme(layout) {
  layout.paper_bgcolor = 'rgba(0,0,0,0)';
  layout.plot_bgcolor  = 'rgba(0,0,0,0)';
  layout.dragmode      = false;
  layout.font = Object.assign(layout.font || {}, {
    color:  'rgba(255,255,255,0.72)',
    family: "'IBM Plex Mono', 'Courier New', monospace",
  });
  ['xaxis', 'yaxis'].forEach(ax => {
    if (!layout[ax]) return;
    layout[ax].gridcolor     = 'rgba(255,255,255,0.07)';
    layout[ax].linecolor     = 'rgba(255,255,255,0.15)';
    layout[ax].zerolinecolor = 'rgba(255,255,255,0.12)';
    layout[ax].tickfont      = Object.assign(layout[ax].tickfont || {}, { color: 'rgba(255,255,255,0.55)' });
  });
  if (layout.legend) {
    layout.legend.bgcolor     = 'rgba(0,0,0,0)';
    layout.legend.bordercolor = 'rgba(255,255,255,0.12)';
  }
  if (layout.updatemenus) {
    layout.updatemenus.forEach(m => {
      m.bgcolor     = 'rgba(15,23,42,0.92)';
      m.bordercolor = 'rgba(255,255,255,0.2)';
      m.font        = Object.assign(m.font || {}, { color: 'white' });
    });
  }
  return layout;
}

// ── Render Plotly charts ──────────────────────────────────
function renderCharts() {
  const cfg = { responsive: true, displayModeBar: false, scrollZoom: false };
  Plotly.newPlot('short-chart', SHORT.data, applyAnalogTheme(SHORT.layout), cfg);
  Plotly.newPlot('long-chart',  LONG.data,  applyAnalogTheme(LONG.layout),  cfg);
}

// ── Init ──────────────────────────────────────────────────
renderCards();
renderCharts();

// ── Fix Cities link for static hosting ────────────────────

  if (btn) btn.href = 'cities.html';
}
