<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BreezeCast</title>
  <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@300&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1008;
    }

    .bg-gif {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(16, 10, 2, 0.48);
      z-index: 1;
    }

    .hero {
      position: relative;
      z-index: 2;
      text-align: center;
    }

    .title-link {
      text-decoration: none;
    }

    .title {
      font-family: 'Oxanium', sans-serif;
      font-weight: 300;
      font-size: clamp(4rem, 13vw, 10rem);
      color: #f5e6c8;
      display: inline-block;
      letter-spacing: 0.12em;
      line-height: 1;
      text-shadow:
        3px 3px 0 #8a6a30,
        6px 6px 0 #4a3810,
        0 0 30px rgba(245, 230, 200, 0.35);
      transition: color 0.2s ease;
    }

    .title-link:hover .title {
      color: #fff8ec;
    }

    .tagline {
      font-family: 'IBM Plex Mono', 'Courier New', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.25em;
      color: rgba(0, 229, 255, 0.55);
      text-transform: uppercase;
      margin-top: 14px;
    }
  </style>
</head>
<body>
  <img class="bg-gif" src="anim_lp.gif" alt="">
  <div class="overlay"></div>

  <div class="hero">
    <a class="title-link" href="cities.html">
      <div class="title">BreezeCast</div>
    </a>
    <p class="tagline">NWP Visualization and ML Forecasting</p>
  </div>
</body>
</html>
